# CI/CD · Arvo × Parthenon
# Fluxo (ADR-003): PR → testes + bundle validate | main → deploy stg + hello (G4) + F3 simulado | manual → prod (com aprovação)
# Autenticação: workload identity federation (GitHub OIDC). É a recomendação da doc Databricks: nenhum token guardado no repositório.
# Pré-requisitos no GitHub:
#   - vars: DATABRICKS_HOST_NAO_PROD, DATABRICKS_HOST_PROD
#   - secrets: DATABRICKS_CLIENT_ID_STG, DATABRICKS_CLIENT_ID_PROD (application IDs dos service principals)
#   - environments "stg" e "prod" (prod com required reviewers), e uma federation policy por SP com subject
#     repo:<org>/<repo>:environment:<env>
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promover_prod:
        description: "Promover para produção?"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30                          # teto do job: nunca mais 46 min travado
    env:
      ARVO_SPARK_MEM: 3g                         # heap explícito do Spark local (ver src/arvo/medallion/local.py)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4              # Spark local para os testes da F5/F6
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -e ".[dev]"                # pacote arvo (src/) com as dependências do pyproject.toml
      - name: Sem Spark · semântica, contratos, plataforma, arquitetura, IA, agentes, funil, entregáveis
        run: pytest tests/semantic tests/contracts tests/platform tests/architecture tests/ai tests/agents tests/funnel tests/deliverables -q
      - name: Prompts versionados e travados (src/arvo/ai/prompts.lock.json)
        run: python -m arvo.ai.prompts verificar
      - name: Painel de sanidade gerado = indicadores.yaml (F9)
        run: python -m arvo.monitoring.gerar --checar
      # Cada suíte Spark em processo (e JVM) próprio: isolamento de memória entre suítes
      - name: Spark · medalhão (F5)
        run: pytest tests/medallion -q
      - name: Spark · motor de regras (F6)
        run: pytest tests/rules -q
      - name: Spark · avaliação científica (F8)
        run: pytest tests/evaluation -q
      - name: Spark · indicadores de sanidade (F9)
        run: pytest tests/monitoring -q
      - name: Spark · rollout por regra (F10)
        run: pytest tests/rollout -q

  validar_bundle:
    # Só roda quando o workspace de stg existir (variável configurada no repositório). Até lá, fica pulado.
    if: vars.DATABRICKS_HOST_NAO_PROD != ''
    needs: testes
    runs-on: ubuntu-latest
    environment: stg
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_NAO_PROD }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_STG }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main        # fixe uma versão ou SHA após a primeira execução verde
      - run: databricks bundle validate -t stg

  deploy_stg:
    if: github.ref == 'refs/heads/main'
    needs: validar_bundle
    runs-on: ubuntu-latest
    environment: stg
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_NAO_PROD }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_STG }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t stg
      - name: G4 · hello pipeline em stg
        run: databricks bundle run platform_smoke_test -t stg
      - name: Semântica em stg
        run: databricks bundle run semantic_load -t stg

  deploy_prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.promover_prod
    needs: deploy_stg
    runs-on: ubuntu-latest
    environment: prod                            # required reviewers: aprovação humana antes de produção
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_PROD }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
      - name: G4 · hello pipeline em prod
        run: databricks bundle run platform_smoke_test -t prod
