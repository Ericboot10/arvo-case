# =====================================================================================================
# ESPECIFICAÇÃO DA ARQUITETURA DE DADOS: fonte única da verdade (ADR-005)
#
# Diagramas (Mermaid/.md, draw.io) e grafo são GERADOS a partir deste arquivo por `python -m arvo.architecture.gerar`.
# Ninguém desenha à mão. Testes garantem que este arquivo, o contrato semântico (src/arvo/semantic/metricas.yaml)
# e o código da F5 dizem a mesma coisa. Se divergirem, o CI falha.
#
# Convenções
#   tipo:    fonte | raw | quarentena | conformada | dimensao | fato_transacao | fato_snapshot_periodico |
#            fato_snapshot_acumulado | metric_view | semantica | contrato | operacao
#   status:  implementado (código + teste) | especificado (desenho aprovado, código em fase futura) | futuro
#   origem:  de onde a tabela é derivada (arestas de linhagem)
#   fks:     coluna -> tabela.coluna (arestas do modelo dimensional)
# =====================================================================================================
versao: 1
projeto: Arvo × Parthenon · Hospital São Rafael

camadas:
  fonte:      {ordem: 0, descricao: "Sistemas e arquivos externos"}
  bronze:     {ordem: 1, descricao: "Bruto, append-only, fiel à origem (tudo string + metadados de ingestão)"}
  quarantine: {ordem: 2, descricao: "Registros reprovados nas expectations, com motivo"}
  silver:     {ordem: 2, descricao: "Tipado, validado, deduplicado e enriquecido com a semântica"}
  contracts:  {ordem: 2, descricao: "Contrato como dado (F3): parâmetros aprovados"}
  semantic:   {ordem: 2, descricao: "Glossário, conceitos e mapas (F2)"}
  gold:       {ordem: 3, descricao: "Modelo dimensional (estrela): fatos e dimensões de negócio"}
  metric:     {ordem: 4, descricao: "UC Metric Views: métricas definidas uma vez (F2)"}
  gold_shadow: {ordem: 3, descricao: "Só em prod: saída do agente em modo sombra, lida pela auditoria e nunca enviada (F10)"}
  ops:        {ordem: 5, descricao: "Telemetria, estado e qualidade"}

tabelas:

  # ============================================================== FONTES
  fonte.sinistro_csv:
    camada: fonte
    tipo: fonte
    status: implementado
    descricao: "Arquivo de itens de conta do prestador (CSV PT-BR, UTF-8 BOM), entregue pela TI da Parthenon no Volume bronze.landing"
    lgpd: [id_beneficiario]
  fonte.contrato_pdf:
    camada: fonte
    tipo: fonte
    status: implementado
    descricao: "PDF do contrato de credenciamento (Volume contracts.raw)"
  fonte.planilha_inteligencias:
    camada: fonte
    tipo: fonte
    status: implementado
    descricao: "Planilha 'Inteligências após 6 meses' (funil de economia da Arvo)"
  fonte.semantica_git:
    camada: fonte
    tipo: fonte
    status: implementado
    descricao: "YAMLs versionados da camada semântica (src/arvo/semantic/*.yaml)"
  fonte.recursos_prestador:
    camada: fonte
    tipo: fonte
    status: futuro
    descricao: "Retorno dos recursos de glosa (sistema da operadora); necessário para taxa de recurso e reversão"
  fonte.eventos_funil_operadora:
    camada: fonte
    tipo: fonte
    status: futuro
    descricao: "Eventos por glosa no sistema da Parthenon: envio, registro, decisão da auditoria com motivo (AMB-18)"
  fonte.gabarito_auditoria:
    camada: fonte
    tipo: fonte
    status: implementado
    descricao: "Gabarito do case (263 itens rotulados). Amostra ENRIQUECIDA e com ruído de rótulo: ver F8"
  fonte.auditoria_amostral:
    camada: fonte
    tipo: fonte
    status: futuro
    descricao: "Decisões dos auditores na amostra estratificada (shadow e produção), F8/F10. Entram em gold.fato_auditoria_amostral como novas rodadas, ao lado da R0 (gabarito)"

  # ============================================================== BRONZE
  bronze.sinistro_raw:
    camada: bronze
    tipo: raw
    status: implementado
    fase: F5
    grao: "1 linha por linha recebida no arquivo (sem deduplicar)"
    chave: [_arquivo, _hash_linha]
    origem: [fonte.sinistro_csv]
    lgpd: [id_beneficiario]
    colunas:
      id_prestador: string
      id_item: string
      id_conta: string
      id_beneficiario: string
      dt_atendimento: string
      carater_atendimento: string
      tipo_conta: string
      cod_tuss: string
      desc_item: string
      tipo_item: string
      qtd: string
      vl_unitario: string
      vl_total: string
      nome_prestador: string
      _arquivo: string
      _hash_linha: string
      _ingest_ts: timestamp
  bronze.gabarito_raw:
    camada: bronze
    tipo: raw
    status: implementado
    fase: F8
    grao: "1 linha por item rotulado no gabarito do case (sobrescrita a cada carga)"
    chave: [id_item]
    origem: [fonte.gabarito_auditoria]
    colunas: {id_item: string, id_conta: string, cod_tuss: string, indevido: string, _arquivo: string, _ingest_ts: timestamp}
  bronze.inteligencias_raw:
    camada: bronze
    tipo: raw
    status: implementado
    fase: F5
    grao: "1 linha por inteligência por arquivo recebido"
    chave: [_arquivo, inteligencia]
    origem: [fonte.planilha_inteligencias]
    colunas:
      inteligencia: string
      tipo: string
      status: string
      economia_identificada: string
      economia_enviada_operadora: string
      economia_enviada_prestador: string
      economia_efetivado: string
      media_efetivacao_arvo: string
      sinistro_processado: string
      mes_sinistro: string
      _arquivo: string
      _ingest_ts: timestamp

  # ============================================================== QUARENTENA
  quarantine.item_conta_rejeitado:
    camada: quarantine
    tipo: quarentena
    status: implementado
    fase: F5
    grao: "1 linha por linha de bronze reprovada em expectation de severidade quarentena/fail"
    chave: [_arquivo, _hash_linha]
    origem: [bronze.sinistro_raw]
    colunas:
      _arquivo: string
      _hash_linha: string
      id_item: string
      motivos: array<string>
      linha_original: string
      _rejeitado_em: timestamp

  # ============================================================== SEMÂNTICA E CONTRATO (F2 / F3)
  semantic.map_tuss_conceito:
    camada: semantic
    tipo: semantica
    status: implementado
    fase: F2
    grao: "1 linha por código TUSS"
    chave: [cod_tuss]
    origem: [fonte.semantica_git]
    colunas: {cod_tuss: string, descricao_canonica: string, conceito: string, conceito_pai: string, tipo_item_origem: string, porte_sala: int, vigencia_inicio: string}
  semantic.dim_dominio_valor:
    camada: semantic
    tipo: semantica
    status: implementado
    fase: F2
    grao: "1 linha por domínio × valor de origem"
    chave: [dominio, valor_origem]
    origem: [fonte.semantica_git]
    colunas: {dominio: string, coluna_origem: string, valor_origem: string, canonico: string}
  contracts.contract_params:
    camada: contracts
    tipo: contrato
    status: implementado
    fase: F3
    grao: "1 linha por versão aprovada de contrato"
    chave: [versao_contrato]
    origem: [fonte.contrato_pdf]
    colunas: {versao_contrato: string, id_contrato: string, documento_sha256: string, aprovado_por: string, papel: string, data_aprovacao: string, params_json: string, vigente: boolean}

  # ============================================================== SILVER
  silver.item_conta:
    camada: silver
    tipo: conformada
    status: implementado
    fase: F5
    grao: "1 linha por item de conta válido (id_item único)"
    chave: [id_item]
    origem: [bronze.sinistro_raw, semantic.map_tuss_conceito, semantic.dim_dominio_valor]
    colunas:
      id_item: string
      id_conta: string
      id_prestador: string
      id_beneficiario_hash: string
      dt_atendimento: date
      competencia: date
      carater_origem: string
      carater_canonico: string
      regime_origem: string
      regime: string
      cod_tuss: string
      desc_item_origem: string
      tipo_item_origem: string
      conceito: string
      conceito_pai: string
      qtd: int
      vl_unitario: "decimal(12,2)"
      vl_total: "decimal(14,2)"
      nome_prestador: string
      versao_semantica: string
      _arquivo: string
      _ingest_ts: timestamp
  silver.conta:
    camada: silver
    tipo: conformada
    status: implementado
    fase: F5
    grao: "1 linha por conta"
    chave: [id_conta]
    origem: [silver.item_conta]
    colunas:
      id_conta: string
      id_prestador: string
      id_beneficiario_hash: string
      dt_atendimento: date
      competencia: date
      carater_canonico: string
      regime: string
      n_itens: int
      vl_total_conta: "decimal(16,2)"
      tem_pacote: boolean
      procedimentos_pacote: array<string>
      conflito_semantico: boolean
  silver.atendimento:
    camada: silver
    tipo: conformada
    status: implementado
    fase: F5
    grao: "1 linha por beneficiário × dia (conceito derivado T11)"
    chave: [id_beneficiario_hash, dt_atendimento]
    origem: [silver.conta, silver.item_conta]
    colunas:
      id_beneficiario_hash: string
      dt_atendimento: date
      n_contas: int
      contas: array<string>
      alguma_conta_com_pacote: boolean
      suspeita_fragmentacao: boolean
      procedimento_cirurgico_repetido: boolean
  silver.funil_inteligencia:
    camada: silver
    tipo: conformada
    status: implementado
    fase: F5
    grao: "1 linha por inteligência × competência"
    chave: [competencia, inteligencia]
    origem: [bronze.inteligencias_raw]
    colunas:
      competencia: date
      cliente: string
      inteligencia: string
      tipo_inteligencia: string
      status_inteligencia: string
      vl_identificado: "decimal(16,2)"
      vl_enviado_operadora: "decimal(16,2)"
      vl_enviado_prestador: "decimal(16,2)"
      vl_efetivado: "decimal(16,2)"
      taxa_efetivacao_benchmark: double
      sinistro_processado: "decimal(18,2)"

  # ============================================================== GOLD · DIMENSÕES
  gold.dim_data:
    camada: gold
    tipo: dimensao
    scd: 0
    status: implementado
    fase: F5
    grao: "1 linha por dia do calendário"
    chave: [data]
    origem: [silver.item_conta]
    colunas: {data: date, competencia: date, ano: int, mes: int, nome_mes: string, dia_semana: int, fim_de_semana: boolean}
  gold.dim_prestador:
    camada: gold
    tipo: dimensao
    scd: 1
    status: implementado
    fase: F5
    grao: "1 linha por prestador"
    chave: [id_prestador]
    origem: [silver.item_conta]
    colunas: {id_prestador: string, nome_prestador: string}
  gold.dim_item_tuss:
    camada: gold
    tipo: dimensao
    scd: 1
    status: implementado
    fase: F5
    grao: "1 linha por código TUSS (dimensão conformada; vem da semântica)"
    chave: [cod_tuss]
    origem: [semantic.map_tuss_conceito]
    colunas: {cod_tuss: string, descricao_canonica: string, conceito: string, conceito_pai: string, tipo_item_origem: string, porte_sala: int}
  gold.dim_perfil_atendimento:
    camada: gold
    tipo: dimensao
    scd: 0
    status: implementado
    fase: F5
    grao: "1 linha por combinação caráter × regime (junk dimension)"
    chave: [sk_perfil]
    origem: [semantic.dim_dominio_valor]
    colunas: {sk_perfil: string, carater_canonico: string, regime: string, conflito_semantico: boolean, descricao: string}
  gold.dim_contrato:
    camada: gold
    tipo: dimensao
    scd: 2
    status: implementado
    fase: F5
    grao: "1 linha por versão de contrato (histórico preservado)"
    chave: [versao_contrato]
    origem: [contracts.contract_params]
    colunas: {versao_contrato: string, id_contrato: string, id_prestador: string, vigencia_inicio: date, vigencia_fim: date, aprovado_por: string, data_aprovacao: string, vigente: boolean}
  gold.dim_item_contratado:
    camada: gold
    tipo: dimensao
    scd: 2
    status: implementado
    fase: F5
    grao: "1 linha por versão de contrato × código (teto e papéis contratuais)"
    chave: [versao_contrato, cod_tuss]
    origem: [contracts.contract_params]
    fks: {versao_contrato: gold.dim_contrato.versao_contrato, cod_tuss: gold.dim_item_tuss.cod_tuss}
    colunas: {versao_contrato: string, cod_tuss: string, vl_teto: "decimal(12,2)", procedimento_em_pacote: boolean, taxa_sala_do_pacote: string, material_incluso_no_pacote: boolean, carater_permitido: array<string>}
  gold.dim_regra:
    camada: gold
    tipo: dimensao
    scd: 2
    status: implementado
    fase: F6
    grao: "1 linha por regra × versão"
    chave: [regra_id, versao_regra]
    origem: [contracts.contract_params, fonte.semantica_git]   # regras em src/arvo/rules/regras.yaml (Git)
    colunas: {regra_id: string, versao_regra: string, nome: string, clausula: string, tipo: string, tipo_glosa: string, prioridade: int, versao_contrato: string, defensabilidade: string}
  gold.dim_inteligencia:
    camada: gold
    tipo: dimensao
    scd: 1
    status: implementado
    fase: F5
    grao: "1 linha por inteligência Arvo"
    chave: [inteligencia]
    origem: [silver.funil_inteligencia]
    colunas: {inteligencia: string, tipo_inteligencia: string}

  # ============================================================== GOLD · FATOS
  gold.fato_item:
    camada: gold
    tipo: fato_transacao
    status: implementado
    fase: F5
    grao: "1 linha por item de conta (antes do motor de regras)"
    chave: [id_item]
    origem: [silver.item_conta, silver.conta, gold.dim_item_contratado, gold.dim_perfil_atendimento]
    fks:
      id_prestador: gold.dim_prestador.id_prestador
      dt_atendimento: gold.dim_data.data
      cod_tuss: gold.dim_item_tuss.cod_tuss
      sk_perfil: gold.dim_perfil_atendimento.sk_perfil
      versao_contrato: gold.dim_contrato.versao_contrato
    degeneradas: [id_conta, id_beneficiario_hash]
    medidas: [qtd, vl_unitario, vl_cobrado, vl_teto_unitario, vl_excedente_potencial]
    colunas:
      id_item: string
      id_conta: string
      id_prestador: string
      id_beneficiario_hash: string
      competencia: date
      dt_atendimento: date
      sk_perfil: string
      carater_canonico: string
      carater_origem: string
      regime: string
      cod_tuss: string
      conceito: string
      conceito_pai: string
      qtd: int
      vl_unitario: "decimal(12,2)"
      vl_cobrado: "decimal(14,2)"
      tem_preco_pactuado: boolean
      vl_teto_unitario: "decimal(12,2)"
      vl_excedente_potencial: "decimal(14,2)"
      conta_tem_pacote: boolean
      conflito_semantico: boolean
      versao_contrato: string
      versao_semantica: string
      run_id: string
  gold.fato_item_auditado:
    camada: gold
    tipo: fato_transacao
    status: implementado
    fase: F6
    grao: "1 linha por item de conta, com o resultado do motor de regras"
    chave: [id_item]
    origem: [gold.fato_item, gold.fato_apontamento]
    fks: {cod_tuss: gold.dim_item_tuss.cod_tuss, dt_atendimento: gold.dim_data.data, versao_contrato: gold.dim_contrato.versao_contrato}
    medidas: [vl_cobrado, vl_excedente_potencial, vl_glosado]
    colunas:  # = contrato semântico src/arvo/semantic/metricas.yaml > tabelas_base.fato_item_auditado (testado)
      id_item: string
      id_conta: string
      id_prestador: string
      id_beneficiario_hash: string
      competencia: date
      dt_atendimento: date
      carater_canonico: string
      carater_origem: string
      regime: string
      cod_tuss: string
      conceito: string
      conceito_pai: string
      qtd: int
      vl_unitario: "decimal(12,2)"
      vl_cobrado: "decimal(14,2)"
      tem_preco_pactuado: boolean
      vl_teto_unitario: "decimal(12,2)"
      vl_excedente_potencial: "decimal(14,2)"
      conta_tem_pacote: boolean
      conflito_semantico: boolean
      glosado: boolean
      regra_principal: string
      clausula_principal: string
      vl_glosado: "decimal(14,2)"
      versao_contrato: string
      versao_semantica: string
      run_id: string
  gold.fato_apontamento:
    camada: gold
    tipo: fato_transacao
    status: implementado
    fase: F6
    grao: "1 linha por glosa (no máximo 1 por item)"
    chave: [id_apontamento]
    origem: [gold.fato_item, silver.conta, gold.dim_regra, gold.dim_item_contratado, gold.dim_contrato]
    fks: {regra_principal: gold.dim_regra.regra_id, versao_contrato: gold.dim_contrato.versao_contrato}
    degeneradas: [id_item, id_conta]
    medidas: [vl_cobrado, vl_referencia, vl_glosado]
    colunas: {id_apontamento: string, id_item: string, id_conta: string, regra_principal: string, clausula_principal: string, clausulas_subsidiarias: array<string>, vl_cobrado: "decimal(14,2)", vl_referencia: "decimal(14,2)", vl_glosado: "decimal(14,2)", justificativa: string, evidencia: array<string>, versao_regra: string, versao_contrato: string, versao_semantica: string, run_id: string, status_envio: string, motivo_revisao: string}
  gold.fato_funil_economia:
    camada: gold
    tipo: fato_snapshot_periodico
    status: implementado
    fase: F5
    grao: "1 linha por inteligência × competência (foto mensal do funil)"
    chave: [competencia, inteligencia]
    origem: [silver.funil_inteligencia]
    fks: {inteligencia: gold.dim_inteligencia.inteligencia, competencia: gold.dim_data.data}
    medidas: [vl_identificado, vl_enviado_operadora, vl_enviado_prestador, vl_efetivado]
    colunas:  # = contrato semântico (testado)
      competencia: date
      cliente: string
      inteligencia: string
      tipo_inteligencia: string
      status_inteligencia: string
      vl_identificado: "decimal(16,2)"
      vl_enviado_operadora: "decimal(16,2)"
      vl_enviado_prestador: "decimal(16,2)"
      vl_efetivado: "decimal(16,2)"
      taxa_efetivacao_benchmark: double
      vl_sinistro_processado: "decimal(18,2)"   # SEMIADITIVO: repete por inteligência; usar MAX por competência
  gold.fato_glosa_ciclo:
    camada: gold
    tipo: fato_snapshot_acumulado
    status: futuro
    fase: F10
    grao: "1 linha por glosa, atualizada a cada marco do ciclo de vida (identificada → efetivada)"
    chave: [id_apontamento]
    origem: [gold.fato_apontamento, gold.ponte_regra_inteligencia, fonte.eventos_funil_operadora, fonte.recursos_prestador]
    fks:
      id_apontamento: gold.fato_apontamento.id_apontamento
      id_prestador: gold.dim_prestador.id_prestador
      regra_principal: gold.dim_regra.regra_id
      inteligencia: gold.dim_inteligencia.inteligencia
      cod_tuss: gold.dim_item_tuss.cod_tuss
      versao_contrato: gold.dim_contrato.versao_contrato
      dt_identificacao: gold.dim_data.data
      etapa_atual: gold.dim_etapa_funil.etapa
      motivo_retencao: gold.dim_motivo.id_motivo
      motivo_registro: gold.dim_motivo.id_motivo
      motivo_reversao: gold.dim_motivo.id_motivo
    degeneradas: [id_item, id_conta]
    medidas: [vl_identificado, vl_enviado_operadora, vl_registrado_prestador, vl_recorrido, vl_revertido, vl_efetivado,
              dias_ate_envio, dias_ate_registro, dias_ate_efetivacao]
    colunas:
      id_apontamento: string
      id_item: string
      id_conta: string
      id_prestador: string
      regra_principal: string
      inteligencia: string
      cod_tuss: string
      versao_contrato: string
      competencia: date
      etapa_atual: string
      dt_identificacao: date
      dt_envio_operadora: date
      dt_registro_prestador: date
      dt_recurso: date
      dt_julgamento: date
      dt_efetivacao: date
      motivo_retencao: string
      motivo_registro: string
      motivo_reversao: string
      vl_identificado: "decimal(14,2)"
      vl_enviado_operadora: "decimal(14,2)"
      vl_registrado_prestador: "decimal(14,2)"
      vl_recorrido: "decimal(14,2)"
      vl_revertido: "decimal(14,2)"
      vl_efetivado: "decimal(14,2)"
      dias_ate_envio: int
      dias_ate_registro: int
      dias_ate_efetivacao: int
  gold.fato_excedente_mensal:
    camada: gold
    tipo: fato_snapshot_periodico
    status: especificado
    fase: F9
    grao: "1 linha por prestador × conceito × competência"
    chave: [id_prestador, conceito, competencia]
    origem: [gold.fato_item, gold.fato_apontamento, gold.ref_linha_base_excedente]
    fks:
      id_prestador: gold.dim_prestador.id_prestador
      competencia: gold.dim_data.data
      versao_linha_base: gold.ref_linha_base_excedente.versao_linha_base
    medidas: [vl_apresentado, vl_excedente, economia_preventiva_estimada]
    colunas:
      id_prestador: string
      conceito: string
      competencia: date
      vl_apresentado: "decimal(16,2)"
      vl_excedente: "decimal(16,2)"
      taxa_excedente: double
      taxa_excedente_base: double
      versao_linha_base: string
      teve_glosa_mes_anterior: boolean
      economia_preventiva_estimada: "decimal(16,2)"   # max(0, taxa_base − taxa_atual) × vl_apresentado (AMB-16)
  gold.fato_auditoria_amostral:
    camada: gold
    tipo: fato_transacao
