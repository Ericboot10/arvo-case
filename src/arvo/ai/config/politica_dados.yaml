# Política de dados da camada de IA (LGPD): QUE classe de dado pode ir para QUAL perímetro.
# O roteador aplica ANTES de chamar qualquer adapter (e antes do cache). Uma violação vira registro BLOQUEADO_POLITICA_DADOS.
versao: 2
classes:
  publico:        "Informação pública (normas ANS, tabelas TUSS)"
  contratual:     "Texto e parâmetros de contrato entre operadora e prestador (sem dado de pessoa)"
  catalogo:       "Código e descrição de item faturado, sem beneficiário, conta ou data"
  agregado:       "Números agregados (somas, contagens, taxas) por dimensões de negócio, sem coluna de pessoa, conta ou data de atendimento"
  pseudonimizado: "Dado de atendimento com pseudônimo (id_beneficiario_hash), sem identificador direto"
  identificavel:  "Qualquer dado com identificador de pessoa (id_beneficiario) ou combinação reidentificável"

perimetros:
  local:      "Execução no próprio processo (determinístico, replay de testes)"
  plataforma: "Modelo hospedado DENTRO do workspace Databricks (endpoints databricks-*), sem saída do perímetro"
  externo:    "Provedor fora do perímetro (OpenAI, Anthropic, Google, inclusive quando roteado pelo AI Gateway)"

permitido:
  local:      [publico, contratual, catalogo, agregado, pseudonimizado]
  plataforma: [publico, contratual, catalogo, agregado, pseudonimizado]
  externo:    [publico, contratual, catalogo, agregado]

nunca: [identificavel]   # nenhum perímetro recebe dado identificável, em nenhuma hipótese

# Agente analista (src/arvo/agents/analyst): o que volta das ferramentas de dados (Genie e SQL semântico) para o modelo orquestrador.
# O resultado é REDUZIDO antes de chegar ao modelo, qualquer que seja o perímetro dele: colunas de pessoa, conta e data
# de atendimento saem, e o que sobra precisa ser 'agregado' ou 'catalogo'. Dado no nível do atendimento fica no Genie
# e no painel, dentro da plataforma.
agente:
  colunas_removidas: [id_beneficiario, id_beneficiario_hash, id_conta, dt_atendimento, linha_original, _hash_linha]
  max_linhas_por_resultado: 50
