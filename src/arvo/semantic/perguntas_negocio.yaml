# Perguntas de negócio = TESTE DE ACEITE da camada semântica.
# Gate G2 só passa se cada pergunta "hoje" puder ser respondida usando apenas métricas e dimensões definidas.
# As mesmas perguntas viram o benchmark do Genie/agente analítico (re-executado a cada release).
versao: 0.1.0
perguntas:
  - id: Q01
    persona: Paulo Antunes (Diretor de Contas Médicas)
    pergunta: Quanto foi cobrado acima do contrato no mês, por cláusula?
    # M03 (taxa_glosa) NÃO aceita clausula_principal: dentro de uma cláusula o denominador seria só o valor dos
    # itens glosados, e a "taxa" perderia o sentido de negócio. Erro pego por este teste de aceite em 06/11/2026.
    metricas: [M02, M04]
    dimensoes: [competencia, clausula_principal]
    disponibilidade: hoje
  - id: Q02
    persona: Dr. Ary Aguiar (Auditoria Médica)
    pergunta: Em quais procedimentos cirúrgicos há cobrança apartada de itens inclusos no pacote, e quanto?
    metricas: [M02, M04]
    dimensoes: [conceito, regra_principal, conta_tem_pacote]
    disponibilidade: hoje
  - id: Q03
    persona: Especialista em Contas Médicas
    pergunta: Qual procedimento/item tem o maior gap entre o valor cobrado e o pactuado?
