[pytest]
# Nenhum teste pode travar o CI em silêncio (incidente de 06/11/2026: 46 min em GC contínuo do Spark local).
# Requer pytest-timeout. Ao estourar, mostra a pilha de todas as threads e falha.
timeout = 300
timeout_method = thread
addopts = -p no:cacheprovider
# Raiz no caminho de importação: `pytest` puro (CI) importa os pacotes como `python -m pytest`
pythonpath = .
testpaths = semantic/tests arvo_contrato/tests plataforma/tests arquitetura/tests ia/tests parte2/tests entrega/tests medalhao/tests motor/tests avaliacao_cientifica/tests sanidade/tests rollout/tests
# Sockets py4j do Spark local deixados ao GC: inofensivos e muito ruidosos
filterwarnings =
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
