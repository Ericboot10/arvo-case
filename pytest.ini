[pytest]
# Nenhum teste pode travar o CI em silêncio (incidente de 06/11/2026: 46 min em GC contínuo do Spark local).
# Requer pytest-timeout. Ao estourar, mostra a pilha de todas as threads e falha.
timeout = 300
timeout_method = thread
addopts = -p no:cacheprovider
# Pacote `arvo` em src/ (layout src): `pytest` puro (CI) importa como `python -m pytest`
pythonpath = src
testpaths = tests
# Sockets py4j do Spark local deixados ao GC: inofensivos e muito ruidosos
filterwarnings =
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
