# Espaço Genie como código. `python -m ia.agente.genie publicar` cria ou atualiza o espaço no workspace.
# O Genie é a PRIORIDADE para descoberta de dados do agente: entende a camada semântica publicada no Unity Catalog
# (metric views com MEASURE, comentários e tags) e estas instruções. Tudo aqui é derivado de semantic/ e do case.
titulo: "Arvo · Auditoria de contas e funil de economia"
descricao: >-
  Dados do case Arvo: sinistro do Hospital São Rafael (junho de 2025) auditado contra o contrato PRT-2025-0417,
  gabarito de auditoria e planilha de inteligências da rede (6 meses). Camada semântica em <catalogo>.semantic.
tabelas:                       # <catalogo> é trocado pelo catálogo do ambiente
  - <catalogo>.semantic.mv_auditoria_glosa
  - <catalogo>.semantic.mv_funil_economia
  - <catalogo>.semantic.mv_qualidade_auditoria
  - <catalogo>.gold.fato_apontamento
  - <catalogo>.gold.dim_regra
  - <catalogo>.ops.v_precisao_recall
instrucoes: |
  * As metric views (mv_*) são a fonte preferida: consulte medidas sempre com MEASURE(<medida>) e GROUP BY ALL.
  * mv_auditoria_glosa = auditoria de UM prestador (Hospital São Rafael, id P001) em UMA competência (2025-06-01).
    valor_apresentado = valor cobrado; valor_glosado = valor que o motor glosou; taxa_glosa = glosado ÷ apresentado.
  * mv_funil_economia = funil da OPERAÇÃO INTEIRA (toda a rede), por inteligência e competência (6 meses).
    indice_norte = economia efetivada ÷ sinistro processado (meta 2%). Não misture com os números do hospital.
  * "No mês" sem data: use a competência mais recente disponível na view consultada.
  * Cláusulas: 2.2 = preço acima do Anexo I (regra R1, glosa só o excedente); 3.3 = itens inclusos no pacote
    (R2 taxa de sala, R2B sala de outro porte, R3 material de rotina; glosa integral); 4.2 = taxa de urgência em
    atendimento eletivo (R4, integral).
  * taxa_glosa NÃO é aberta por clausula_principal (o denominador perderia o sentido). Por cláusula, use valor_glosado
    e itens_glosados.
  * "Pronto Socorro" é regime de atendimento, não caráter. Conflito semântico = regime PRONTO_SOCORRO com caráter
    ELETIVO (decisão AMB-01): vai para revisão humana.
  * Precisão e recall do motor contra o gabarito: ops.v_precisao_recall, linha recorte = 'total' (por regra: ordem = 1,
    só precisão). Valores entre 0 e 1.
    precisao_auditada (mv_qualidade_auditoria) é outra métrica: a precisão PONDERADA pelo peso amostral.
    taxa_indevido_nao_detectado NÃO é 1 − recall. Para "precisão e recall", use sempre ops.v_precisao_recall.
  * taxa_conflito_semantico já é sobre todos os itens: não filtre por regime ou caráter para obtê-la.
  * fato_apontamento tem uma linha por glosa, com regra, cláusula, valores e justificativa. Não exponha id_conta.
  * Responda em português, com valores em reais.
exemplos:
  - pergunta: "Quanto foi glosado por regra?"
    sql: |
      SELECT regra_principal, MEASURE(valor_glosado) AS valor_glosado, MEASURE(itens_glosados) AS itens_glosados
      FROM <catalogo>.semantic.mv_auditoria_glosa
      WHERE regra_principal IS NOT NULL
      GROUP BY ALL
      ORDER BY valor_glosado DESC
  - pergunta: "Qual o índice-norte do mês mais recente?"
    sql: |
      SELECT competencia, MEASURE(indice_norte) AS indice_norte, MEASURE(atingimento_meta) AS atingimento_meta
      FROM <catalogo>.semantic.mv_funil_economia
      GROUP BY ALL
      ORDER BY competencia DESC
      LIMIT 1
perguntas_sugeridas:
  - "Quanto foi glosado por cláusula no mês?"
  - "Qual a precisão e o recall do motor contra o gabarito?"
  - "Quanto falta para a meta de 2% no mês mais recente?"
