        comparison_operator: GREATER_THAN
        source:
          name: n_alerta
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: true
          retrigger_seconds: 86400
      schedule:
        quartz_cron_schedule: 0 0 7 * * ?
