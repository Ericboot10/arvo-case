# F5 · pipeline Lakeflow (serverless) e job que o orquestra.
resources:
  pipelines:
    f5_medalhao_pipeline:
      name: arvo-f5-medalhao-${bundle.target}
      catalog: ${var.catalog}
      schema: silver                         # schema padrão. As tabelas usam nomes totalmente qualificados
      serverless: true
      libraries:
        - notebook:
            path: ../medalhao/pipeline_lakeflow.py
      configuration:
        arvo.catalog: ${var.catalog}
        arvo.landing: /Volumes/${var.catalog}/bronze/landing/
        arvo.repo_root: ${workspace.file_path}

  jobs:
    f5_medalhao:
      name: arvo-f5-medalhao-${bundle.target}
      description: "Planilha → bronze, pipeline Lakeflow (bronze→silver→gold), coleta de DQ para ops.dq_resultados"
      tasks:
        - task_key: ingerir_planilha
          notebook_task:
            notebook_path: ../medalhao/notebooks/ingerir_planilha.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: pipeline
          depends_on:
            - task_key: ingerir_planilha
          pipeline_task:
            pipeline_id: ${resources.pipelines.f5_medalhao_pipeline.id}
        - task_key: coletar_dq
          depends_on:
            - task_key: pipeline
          notebook_task:
            notebook_path: ../medalhao/notebooks/coletar_dq.py
            base_parameters:
              catalog: ${var.catalog}
              pipeline_id: ${resources.pipelines.f5_medalhao_pipeline.id}
      tags:
        fase: F5
