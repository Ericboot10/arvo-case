# Glossário de negócio — fonte da verdade sobre o SIGNIFICADO dos termos.
# Nenhum termo entra em regra, métrica, prompt ou dashboard sem estar aqui com status "aprovado".
# Campos: id | termo | definicao | fonte | sinonimos | nao_confundir_com | ref (conceito/domínio/métrica) | dono | status | pendencias
versao: 0.2.0
status: rascunho_pendente_G2
donos_validos: [especialista_contas_medicas, auditor_medico, juridico, pm_cs, analytics_engineer, engenheiro_dados, cientista_dados]

termos:

  # ===================== PARTES E INSTRUMENTO =====================
  - id: T01
    termo: Operadora
    definicao: Operadora de plano de saúde que paga as contas (Parthenon Saúde). Quem glosa.
    fonte: Contrato PRT-2025-0417, preâmbulo
    dono: juridico
    status: proposto
  - id: T02
    termo: Prestador
    definicao: Estabelecimento credenciado que presta o serviço e apresenta a conta (Hospital São Rafael, id P001).
    fonte: Contrato, preâmbulo; coluna id_prestador
    dono: juridico
    status: proposto
  - id: T03
    termo: Beneficiário
    definicao: Pessoa coberta pelo plano que recebeu o atendimento (id_beneficiario). Dado pessoal; com dado de saúde associado é sensível (LGPD).
    fonte: coluna id_beneficiario
    dono: pm_cs
    status: proposto
  - id: T04
    termo: Contrato de credenciamento
    definicao: Instrumento que fixa preços, pacotes e regras de cobrança entre operadora e prestador. Cada versão aprovada gera `versao_contrato`.
    fonte: Contrato PRT-2025-0417 (vigência 01/01/2025 + 24 meses)
    dono: juridico
    status: proposto
    pendencias: [AMB-13]
  - id: T05
    termo: Cláusula
    definicao: Disposição contratual numerada (p. ex. 2.2, 3.3, 4.2) que fundamenta uma regra de auditoria.
    fonte: Contrato
    dono: juridico
    status: proposto
  - id: T06
    termo: Fee-for-service
    definicao: Modelo de remuneração por item/serviço prestado, a valores de tabela. Modelo do contrato PRT-2025-0417.
    fonte: Contrato, Cl. 1.1
    nao_confundir_com: ["modelo de remuneração da Arvo (não informado no case)"]
    dono: juridico
    status: proposto

  # ===================== PREÇO =====================
  - id: T07
    termo: Valor pactuado
    definicao: >
      Valor unitário MÁXIMO acordado no Anexo I (teto). Cobrar abaixo é permitido; cobrar acima gera glosa do excedente.
    fonte: Anexo I ("Valores unitários máximos pactuados"); Cl. 2.1–2.2
    sinonimos: [valor de tabela, preço contratado, teto]
    nao_confundir_com: ["preço fixo", "valor de referência de mercado (CBHPM/Brasíndice)"]
    ref: {papel_contratual: ITEM_COM_PRECO_PACTUADO}
    dono: juridico
    status: proposto
  - id: T08
    termo: Excedente
    definicao: (valor unitário cobrado − valor pactuado) × quantidade, quando positivo.
    fonte: Cl. 2.2
    dono: juridico
    status: proposto

  # ===================== ESTRUTURA DA COBRANÇA =====================
  - id: T09
    termo: Conta
    definicao: >
      Agrupador de faturamento apresentado pelo prestador (id_conta). É o ESCOPO do pacote
      ("para a conta em que o procedimento for realizado"). Cada conta tem um único beneficiário,
      data, caráter e regime no dado de jun/2025.
    fonte: Cl. 3.2; coluna id_conta
    nao_confundir_com: ["Guia (T10)", "Atendimento/episódio (T11)"]
    dono: especialista_contas_medicas
    status: proposto
    pendencias: [AMB-02]
  - id: T10
    termo: Guia
    definicao: Documento TISS que autoriza/registra o atendimento. NÃO existe como coluna no dado do case; não assumir que conta = guia.
    fonte: Padrão TISS (ANS)
    dono: especialista_contas_medicas
    status: proposto
  - id: T11
    termo: Atendimento (episódio)
    definicao: >
      Conjunto de contas do mesmo beneficiário no mesmo dia/período. Conceito DERIVADO (não vem da origem),
      necessário para detectar fragmentação de conta e procedimentos sobrepostos.
    fonte: Derivado (id_beneficiario + dt_atendimento)
    dono: especialista_contas_medicas
    status: proposto
    pendencias: [AMB-02, AMB-08]
  - id: T12
    termo: Item de conta
    definicao: Linha cobrada numa conta (id_item), com código, quantidade, valor unitário e total. Grão da auditoria.
    fonte: coluna id_item
    dono: engenheiro_dados
    status: proposto
  - id: T13
    termo: Código TUSS
    definicao: Código da Terminologia Unificada da Saúde Suplementar que identifica o item. Chave de negócio do item (a descrição não é chave).
    fonte: Padrão TISS/TUSS (ANS); coluna cod_tuss
    ref: {arquivo: map_tuss_conceito.yaml}
    dono: especialista_contas_medicas
    status: proposto

  # ===================== CARÁTER x REGIME (zona de maior confusão) =====================
  - id: T14
    termo: Caráter de atendimento
    definicao: >
      Natureza clínica do atendimento informada pelo prestador: ELETIVO ou URGENCIA_EMERGENCIA.
      É o campo que a Cl. 4.1 usa ("caráter registrado").
    fonte: Cl. 4.1–4.2; coluna carater_atendimento
    nao_confundir_com: ["Regime de atendimento / Pronto Socorro (T17)", "Taxa de urgência (T18)"]
    ref: {dominio: carater_atendimento}
    dono: especialista_contas_medicas
    status: proposto
    pendencias: [AMB-01, AMB-07]
  - id: T15
    termo: Urgência
    definicao: >
      Agravo à saúde imprevisto, com ou sem risco potencial de vida, que requer assistência médica imediata
      (definição clínica de referência a validar com o Auditor — usualmente atribuída à Resolução CFM 1.451/1995).
      Para a Cl. 4.1 é equivalente a emergência; canônico: URGENCIA_EMERGENCIA.
    fonte: Cl. 4.1; definição clínica a validar
    sinonimos: [urgente]
    nao_confundir_com: ["Emergência (T16) — clinicamente distinta", "Pronto Socorro (local)"]
    ref: {dominio: carater_atendimento, valor: URGENCIA_EMERGENCIA}
    dono: auditor_medico
    status: proposto
    pendencias: [AMB-07]
  - id: T16
    termo: Emergência
    definicao: >
      Condição que implica risco iminente de vida ou sofrimento intenso, exigindo tratamento médico imediato
      (definição clínica de referência a validar com o Auditor). Para a Cl. 4.1 é equivalente a urgência.
      O dado de origem NÃO tem valor "Emergência" — AMB-07.
    fonte: Cl. 4.1; definição clínica a validar
    ref: {dominio: carater_atendimento, valor: URGENCIA_EMERGENCIA}
    dono: auditor_medico
    status: proposto
    pendencias: [AMB-07]
  - id: T17
    termo: Regime de atendimento
    definicao: >
      Local/regime em que a conta foi gerada: INTERNACAO, AMBULATORIAL ou PRONTO_SOCORRO (coluna tipo_conta).
      Um atendimento em Pronto Socorro NÃO é, por definição, de urgência: o caráter é um campo separado.
    fonte: coluna tipo_conta
    sinonimos: [tipo de conta, setor, local de atendimento]
    nao_confundir_com: ["Caráter de atendimento (T14)"]
    ref: {dominio: regime_atendimento}
    dono: especialista_contas_medicas
    status: proposto
    pendencias: [AMB-01, AMB-12]
  - id: T18
    termo: Taxa de urgência/emergência
    definicao: >
      ITEM cobrável (código 99999001) devido EXCLUSIVAMENTE quando o caráter registrado é urgência ou emergência.
      Cobrada em atendimento eletivo é integralmente glosada.
    fonte: Cl. 4.1–4.2; Anexo I
    nao_confundir_com: ["caráter URGENCIA_EMERGENCIA (T14)", "regime PRONTO_SOCORRO (T17)"]
    ref: {conceito: TAXA_URGENCIA_EMERGENCIA, papel_contratual: TAXA_CONDICIONADA_AO_CARATER}
    dono: juridico
    status: proposto
    pendencias: [AMB-01]

  # ===================== PACOTE =====================
  - id: T19
    termo: Pacote cirúrgico
    definicao: >
      Regime de remuneração fechada de um procedimento do Anexo II pelo valor de tabela, que já engloba a taxa de sala
      do porte correspondente e os materiais de rotina, para a conta em que o procedimento for realizado.
    fonte: Cl. 3.1–3.3; Anexo II
    ref: {papel_contratual: PROCEDIMENTO_EM_PACOTE}
    dono: juridico
    status: proposto
    pendencias: [AMB-02, AMB-11, AMB-12]
  - id: T20
    termo: Item incluso no pacote
    definicao: >
      Item cujo valor está contido no pacote e cuja cobrança apartada na MESMA CONTA é integralmente glosada (Cl. 3.3).
      No PRT-2025-0417: taxa de sala do porte do pacote + fio 70520020 + compressa 70402600.
    fonte: Cl. 3.2–3.3
    ref: {papel_contratual: ITEM_INCLUSO_NO_PACOTE}
    dono: juridico
    status: proposto
  - id: T21
    termo: Item excluído do pacote
    definicao: Itens que o contrato declara fora do pacote e cobráveis pelo Anexo I (diárias, UTI, materiais especiais, medicamentos, SADT).
    fonte: Cl. 3.4
    ref: {papel_contratual: ITEM_EXCLUIDO_DO_PACOTE}
    dono: juridico
    status: proposto
  - id: T22
    termo: Porte (da sala cirúrgica)
    definicao: Graduação da taxa de sala (porte 2 = 20103050; porte 4 = 20103077). No case, só porte de SALA.
    fonte: Anexo I e II
    nao_confundir_com: ["porte anestésico", "porte do procedimento (CBHPM)"]
    ref: {conceito: TAXA_SALA_CIRURGICA}
    dono: especialista_contas_medicas
    status: proposto
    pendencias: [AMB-11]
  - id: T23
    termo: Material de rotina
    definicao: >
      Termo CONTRATUAL de lista fechada: no PRT-2025-0417 são apenas 70520020 (fio de sutura agulhado) e 70402600
      (compressa cirúrgica estéril). O sentido genérico de "material de uso rotineiro" NÃO amplia a lista.
    fonte: Cl. 3.2(b)
    nao_confundir_com: ["material de uso comum (sentido genérico)", "material especial (T24)"]
    ref: {papel_contratual: ITEM_INCLUSO_NO_PACOTE}
    dono: juridico
    status: proposto
  - id: T24
    termo: Material especial
    definicao: Material de maior custo/complexidade (p. ex. cateter venoso central 70451938). Não integra o pacote (Cl. 3.4).
    fonte: Cl. 3.4
    ref: {conceito: MATERIAL_ESPECIAL}
    dono: especialista_contas_medicas
    status: proposto
  - id: T25
    termo: Diária
    definicao: Remuneração por dia de leito. Conceito próprio (a origem a classifica como "Taxa"). Não integra o pacote (Cl. 3.4).
    fonte: Cl. 3.4; Anexo I
    ref: {conceito: DIARIA}
    dono: especialista_contas_medicas
    status: proposto
    pendencias: [AMB-09]
  - id: T26
    termo: SADT
    definicao: Serviço auxiliar de diagnóstico e terapia (exames). Não integra o pacote (Cl. 3.4).
    fonte: Cl. 1.2, 3.4
    ref: {conceito: SADT}
    dono: especialista_contas_medicas
    status: proposto

  # ===================== GLOSA =====================
  - id: T27
    termo: Glosa
    definicao: Recusa total ou parcial de pagamento de um item, comunicada ao prestador com a cláusula infringida e o valor glosado.
    fonte: Cl. 5.1–5.2
    dono: juridico
    status: proposto
  - id: T28
    termo: Glosa integral
    definicao: Glosa de 100% do valor cobrado do item (Cl. 3.3 e 4.2).
    fonte: Cl. 3.3, 4.2
    dono: juridico
    status: proposto
  - id: T29
    termo: Glosa parcial (de excedente)
    definicao: Glosa apenas do excedente sobre o valor pactuado (Cl. 2.2).
    fonte: Cl. 2.2
    dono: juridico
    status: proposto
  - id: T30
    termo: Glosa administrativa x técnica
    definicao: >
      Administrativa: regra objetiva verificável no dado/contrato (preço, pacote, caráter registrado).
      Técnica: depende de julgamento clínico (pertinência, quantidade adequada). Determina quem revisa (Auditor x automático).
    fonte: Prática de mercado; planilha "Inteligências após 6 meses" (coluna Tipo)
    dono: auditor_medico
    status: proposto
    pendencias: [AMB-01]
  - id: T31
    termo: Apontamento
    definicao: Registro produzido pelo agente para um item glosável — item, regra, cláusula principal e subsidiárias, valores, evidência e versões.
    fonte: Definição do projeto
    dono: analytics_engineer
    status: proposto
  - id: T32
    termo: Fundamento principal x subsidiário
    definicao: >
      Quando um item infringe mais de uma regra, o fundamento principal é a regra integral de texto mais literal;
      as demais são registradas como subsidiárias (defesa em camadas). O valor glosado nunca excede o cobrado.
    fonte: Definição do projeto (a validar pelo Jurídico)
    dono: juridico
    status: proposto
    pendencias: [AMB-14]
  - id: T33
    termo: Evidência
    definicao: Itens/campos da conta que disparam a regra (p. ex. o procedimento de pacote presente na conta).
    fonte: Definição do projeto
    dono: analytics_engineer
    status: proposto

  # ===================== PÓS-GLOSA =====================
  - id: T34
    termo: Recurso
    definicao: Contestação formal do prestador contra uma glosa, no prazo regulamentar.
    fonte: Cl. 5.2
    dono: juridico
    status: proposto
  - id: T35
    termo: Reversão
    definicao: Recurso julgado procedente (glosa desfeita, total ou parcialmente). Mede a precisão real em campo.
    fonte: Definição do projeto
    ref: {metrica: M13}
    dono: juridico
    status: proposto

  # ===================== FUNIL DE ECONOMIA (Parte 2) =====================
  - id: T36
    termo: Inteligência
    definicao: Regra/detector de cobrança indevida do produto Arvo (p. ex. "Guias duplicadas"). Pode estar Ligada ou Desligada.
    fonte: Planilha "Inteligências após 6 meses"
    dono: pm_cs
    status: proposto
  - id: T37
    termo: Economia identificada
    definicao: Valor apontado pela inteligência antes de qualquer decisão da operadora. (Definição presumida.)
    fonte: Planilha (coluna "Economia Identificada")
    ref: {metrica: M15}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-05]
  - id: T38
    termo: Economia enviada à operadora
    definicao: Parcela da economia identificada que a operadora aceitou/encaminhou após sua revisão. (Definição presumida.)
    fonte: Planilha
    dono: pm_cs
    status: proposto
    pendencias: [AMB-05]
  - id: T39
    termo: Economia enviada ao prestador
    definicao: Parcela efetivamente registrada e comunicada ao prestador como glosa. (Definição presumida.)
    fonte: Planilha
    dono: pm_cs
    status: proposto
    pendencias: [AMB-05]
  - id: T40
    termo: Economia efetivada
    definicao: Valor glosado que se manteve após o ciclo de recurso — economia realizada. (Definição presumida.)
    fonte: Planilha
    ref: {metrica: M14}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-05]
  - id: T41
    termo: Retenção
    definicao: Economia identificada de inteligência LIGADA que não foi enviada à operadora (retida na revisão do cliente).
    fonte: Derivado da planilha
    ref: {metrica: M16}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-05]
  - id: T42
    termo: Perda de registro
    definicao: Diferença entre economia enviada à operadora e enviada ao prestador.
    fonte: Derivado da planilha
    ref: {metrica: M17}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-05]
  - id: T43
    termo: Sinistro
    definicao: >
      Montante de despesas assistenciais apresentadas à operadora num período (R$ 70 mi/mês na Parthenon).
      No arquivo do case, "sinistro" é o conjunto de itens do Hospital São Rafael em jun/2025 (R$ 1.194.396,92).
    fonte: Enunciado; planilha; sinistro-hospital-saorafael.csv
    nao_confundir_com: ["sinistralidade (sinistro ÷ receita)"]
    dono: pm_cs
    status: proposto
    pendencias: [AMB-06]
  - id: T44
    termo: Competência
    definicao: Mês de referência da cobrança/atendimento usado para agregar métricas (jun/2025 no case).
    fonte: coluna dt_atendimento; planilha ("Mes Sinistro")
    dono: analytics_engineer
    status: proposto
    pendencias: [AMB-06]

  # ===================== INDICADORES GOLD =====================
  - id: T45
    termo: Indicador-norte
    definicao: >
      Economia efetivada ÷ sinistro processado no mês (meta ≥ 2%). Decompõe-se em 5 fatores que se multiplicam
      (identificação × ativação × envio × registro × efetivação), cada um com dono e alavanca próprios.
    fonte: Meta comercial do case; semantic/metricas.yaml > arvore_norte
    sinonimos: [north star, KPI principal]
    nao_confundir_com: ["economia identificada (insumo, não resultado)"]
    ref: {metrica: M20}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-15]
  - id: T46
    termo: Economia preventiva
    definicao: >
      Valor que deixou de ser cobrado indevidamente porque o prestador mudou de comportamento, contra uma linha de
      base congelada. Sem ela, o sucesso do agente aparece como queda de glosa.
    fonte: Definição do projeto
    ref: {metrica: M29}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-16]
  - id: T47
    termo: Reincidência
    definicao: Prestador × conceito glosado no mês anterior que voltou a cobrar acima do teto no mês corrente.
    fonte: Definição do projeto
    ref: {metrica: M28}
    dono: especialista_contas_medicas
    status: proposto
  - id: T48
    termo: Valor em risco
    definicao: Valor glosado que está em recurso e ainda pode ser revertido.
    fonte: Definição do projeto
    ref: {metrica: M32}
    dono: juridico
    status: proposto
  - id: T49
    termo: Etapa do funil
    definicao: >
      Posição da glosa no ciclo de vida: IDENTIFICADA → (RETIDA_OPERADORA | ENVIADA_OPERADORA) →
      REGISTRADA_PRESTADOR → EM_RECURSO → (REVERTIDA | EFETIVADA). Ver semantic/funil.yaml.
    fonte: Definição do projeto
    ref: {arquivo: funil.yaml}
    dono: pm_cs
    status: proposto
    pendencias: [AMB-18]
  - id: T50
    termo: Motivo (retenção, registro, reversão)
    definicao: Código fechado (RET-*, REG-*, REC-*) que explica por que uma glosa parou numa etapa. Lista em semantic/funil.yaml.
    fonte: Definição do projeto
    ref: {arquivo: funil.yaml}
    dono: auditor_medico
    status: proposto
    pendencias: [AMB-19]
  - id: T51
    termo: Guardrail
    definicao: Contra-indicador que impede que o indicador-norte suba à custa de glosa ruim (reversão, precisão, atrito, invariantes).
    fonte: Definição do projeto
    ref: {metrica: M13}
    dono: cientista_dados
    status: proposto
